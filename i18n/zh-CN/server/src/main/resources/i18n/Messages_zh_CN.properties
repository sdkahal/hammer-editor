home_meta_description=Hammer 是一款开源的工具，用于创作故事，以及故事所存在于其中的世界。
home_meta_tagline=拥有你的书，构建你的世界
# Masthead
home_masthead_title_first=拥有你的书，
home_masthead_title_second=构建你的世界
home_masthead_subtitle=免费且开源。可离线使用，适配你拥有的每一台设备，每一章都只是一个纯文本文件，存放在你自己的磁盘上。
home_hero_download=免费下载
home_hero_platforms=支持 Windows、macOS、Linux、Android 和 iOS。免费且开源。
# Writing features
home_features_eyebrow=用 Hammer 写作
home_features_title=为小说真正的创作方式而打造
home_features_lede=可以随意移动的场景、知道谁在其中出场的百科、时间线、笔记，以及你实际写下内容的记录。
home_feature_editor_title=不喧宾夺主的编辑器
home_feature_editor_body1=你的场景、你为它写的大纲，以及你关于它的笔记，全都在同一屏上。字数统计和元数据在你需要时出现在侧边，不需要时便消失不见。
home_feature_editor_body2=你可以随意把书拆分成尽可能小的场景，当两个角色需要更早相遇时，再拖动它们调整顺序。
home_feature_editor_alt=显示一个场景的 Hammer 编辑器，左侧为场景列表，右侧为大纲、笔记和引用
home_feature_encyclopedia_title=一个长得像你世界的百科
home_feature_encyclopedia_body1=角色、地点、事件以及你发明的一切其他事物，还可以配上图片。加上标签、随时搜索，让它们就在你正在看的那一页触手可及。
home_feature_encyclopedia_body2=Hammer 会读取你的场景并弄清楚谁在其中出场。打开一个角色，它会列出他出场的每一个场景；打开一个场景，它会显示识别到的角色和地点，由你来确认或忽略。完全不需要手动记住给任何东西打标签。
home_feature_encyclopedia_body3=这样你就能回答每个草稿最终都会提出的问题：她去哪了？连续三章没有你的反派，就会显现为一个你能看见的空白。
home_feature_encyclopedia_alt=显示角色、地点和事件配图条目的 Hammer 百科
home_feature_timeline_title=按顺序铺开情节
home_feature_timeline_body1=把故事中的事件，或者你世界的历史，放到带日期和标签的时间线上，这样你就能看出药水出现在审判之前，也能看出连续三章没有你的反派。
home_feature_timeline_alt=列出带日期、带标签的故事事件的 Hammer 时间线
home_feature_notes_title=用来存放你刚刚冒出的想法
home_feature_notes_body1=关于你自己书稿的某个观察，偏偏在最不合适的时候出现。给它打上标签，日后再找回来，把它放在手稿旁边，而不是放在桌面上一个叫 notes2-final.txt 的文件里。
home_feature_notes_alt=带标签的故事笔记的 Hammer 笔记视图
home_feature_activity_title=它统计你写了多少，而不是有多少留存
home_feature_activity_body1=Hammer 会留意每一次保存，统计你新增的字数，忽略删除和调换顺序。哪怕你花一整天把一章删得支离破碎，它仍会记录下你写过的内容，因为那确实是你写的。
home_feature_activity_body2=每日和每周目标、今天的字数、本周与上周的对比、你当前和最长连续记录、你的最佳一天，以及一张十二周的热力图。它还知道你工作日和周末的平均字数差异，事实证明这比听起来有用得多。
home_feature_activity_body3=开启同步后，各设备上的写作记录会合并：你在公交站写下的四百个字，会和在书桌前写下的那些计入同一个总数。Hammer 甚至还能告诉你你在哪台设备上写得最好。
home_feature_activity_body4=而且这份日志就像其他一切一样，是项目文件夹里的一个纯文本文件。你的写作历史归你阅读，也归你删除。
home_feature_activity_alt=显示总字数、每周目标进度条、本周与上周对比以及写作连续记录的 Hammer 项目主页
# After the draft
home_afterdraft_eyebrow=草稿之后
home_afterdraft_title=当这本书不得不离开你的书桌
home_afterdraft_lede=写作只是一半。某个时刻，草稿总要送到编辑、试读读者、经纪人或陌生人手里。通常写作软件就是在这一步停下，然后开始复制粘贴。
home_feature_review_title=发给你的编辑。他们无需注册账号。
home_feature_review_body1=选择场景，输入一个电子邮件地址，Hammer 就会发送一个链接。你的编辑在浏览器中打开它，并直接在文字上批注修改建议。无需下载，无需注册，也不用交出项目的副本。
home_feature_review_body2=你能看到他们何时打开、已读了哪些场景，以及还有多少建议在等你处理。为每个请求加上标签，方便自己查看：我的经纪人，试读 2。链接会过期，你也可以随时撤销。
home_feature_review_alt=在浏览器中打开的一个审阅请求，稿件上标出了编辑的修改建议，每条旁边有接受或拒绝的按钮
home_feature_private_title=展示给三个人
home_feature_private_body1=私密链接有密码保护，可以设置过期时间，也可以随时撤销。如果你想知道谁还在读，可以为每位读者生成单独的链接。
home_feature_private_alt=创建私密访问的对话框，在故事的分享面板上要求输入密码和可选的过期日期
home_feature_publish_title=或者向所有人公开
home_feature_publish_body1=一个以你笔名呈现的公开故事页面，一个汇总你已发布作品的作者页面，以及社区动态流中的一席之地。
home_feature_publish_body2=你能看到究竟有多少人真正读过它，累计多少、每天多少。
home_feature_publish_body3=而且它会在你公开之前告诉你这么做可能带来什么代价，而不是事后再说。
home_feature_publish_alt=一个已发布的故事，显示其公开分享链接，以及带总数和每日图表的读者面板
home_feature_export_title=五种格式，并且它会告诉你该选哪个
home_feature_export_markdown_name=Markdown
home_feature_export_markdown_body=用于版本控制，或迁移到其他工具。
home_feature_export_epub_name=EPUB
home_feature_export_epub_body=适合在电子墨水阅读器和手机上试读，正文需要能够重排。
home_feature_export_pdf_name=PDF
home_feature_export_pdf_body=适合版面绝对不能移动的情况。
home_feature_export_word_name=Word
home_feature_export_word_body=适合会留下批注或修订的人。
home_feature_export_rtf_name=RTF
home_feature_export_rtf_body=适合你不知道对方用什么软件的情况。
home_feature_export_body1=Hammer 会在你做选择的那一刻解释每一种格式，而不是让你对着一排文件扩展名自己猜。
home_feature_export_alt=导出对话框，含格式选择器以及将顶层场景视为章节的选项
# The three rules
home_rules_eyebrow=三条原则
home_rules_title=现在来说十年后依然重要的部分
home_rules_lede=你刚才看到的一切都建立在三条原则之上。这些功能中的每一个都写入你自己拥有的文件夹里的纯文件，这正是选择它而非其他方案的全部理由。
home_rule_offline_name=离线优先
home_rule_offline_title=永远无需联网也能使用
home_rule_offline_body=Hammer 从未要求过联网，将来也不会。在木屋里、在飞机上、在停在无信号地方的面包车里写作。你可以随意在设备之间同步，通过像这样的服务器或你自己搭建的服务器，但没有任何东西需要等待服务器，也不会因为某个服务宕机而出问题。
home_rule_files_name=数据透明
home_rule_files_title=打开文件夹，一切都说得通
home_rule_files_body=不是数据库，不是专有的打包格式。关闭 Hammer 打开项目文件夹，你这本书的形状已经就在那里：每个场景一个文件，用你当初命名的方式命名。你可以搜索它、备份它、把它邮件发给自己。阅读自己的作品不该需要这个程序，或者一个计算机科学学位。
home_rule_safety_name=永不丢失数据
home_rule_safety_title=它对丢失你的作品近乎偏执
home_rule_safety_body=丢失你的作品是这款程序唯一不允许出现的缺陷。同步开始时会先完整备份整个项目。大改之前保存的草稿永远都在，随时可以回去。尚未保存的编辑内容会在你输入时就写入磁盘，所以一次崩溃最多让你损失一个句子。当两台设备出现分歧时，Hammer 会问哪一个才对，而不是悄悄替你选择。
# Origin story
home_origin_eyebrow=它为何如此设计
home_origin_title=我在丢失一份手稿之后写下了这些原则
home_origin_body1=我曾住在一辆面包车里，四处漂泊，常常在非常偏远的地方写作。那时我没有工作，用的是一款声称支持离线写作的免费写作软件。事实证明，这个说法站不住脚。离线大约一周后，它就不能用了。等我回到有信号的地方，它又能用了，但我的手稿不见了。
home_origin_body2=我去浏览这款软件的社区论坛，看到许多其他作者在问和我一样的问题：我的手稿去哪了？
home_origin_body3=Hammer 这个想法的种子就诞生于这段经历。为什么现在所有东西都是网页？我只想用手边这台属于自己的电脑来写作和存放我的故事。
home_origin_caption=这三条原则的由来。2020 年 9 月
home_origin_alt=一辆停在红土上的露营车，夕阳下后门敞开，露出床铺和收纳箱，旁边地上有一条黑狗和登山装备
home_origin_link=阅读完整故事
# Price
home_price_eyebrow=费用
home_price_amount=免费
home_price_body=Hammer 采用 MIT 许可证，免费且开源。没有试用期，无需绑定卡片，写作不需要账号，也没有付费版应用。如果这台服务器明天消失，你机器上的那份仍会像今天一样继续正常工作。
# FAQ
home_faq_title=常见问题
home_faq_account_q=我需要账号吗？
home_faq_account_a=不需要。下载下来直接写。账号只是为了让你的设备之间能够同步，完全可选。
home_faq_where_q=我的作品存放在哪里？
home_faq_where_a=在你自己设备上选择的文件夹中，以纯文本文件的形式存放，每个场景一个文件，笔记和百科条目则是旁边那些小巧易读的文件。
home_faq_export_q=我能把我的稿子取出来吗？
home_faq_export_a=它从来没有被关在里面。你的场景本来就是普通文件，无论是否安装 Hammer，你都可以打开、复制，或者交给任何人。当你想要单个文件而不是一个文件夹时，把整本书导出为 Markdown、EPUB、PDF、Word 或 RTF。
home_faq_editor_q=我的编辑需要购买什么吗？
home_faq_editor_a=不需要，他们也不需要账号。你发送一个链接，他们在浏览器里批注你选中的场景，你收到修改建议。链接会过期，你也可以撤销。
home_faq_goesaway_q=如果 Hammer 消失了会怎样？
home_faq_goesaway_a=你的书不会有任何事。它已经是地球上任何文本编辑器都能打开的格式。源码采用 MIT 许可证，所以任何人都可以让这个应用活下去。
home_faq_privacy_q=我的作品会被发送到别处吗？
home_faq_privacy_a=只有在你开启同步时才会，而且只发往你选择的同步服务器，无论是这台还是你自己搭建的。
home_faq_platforms_q=支持哪些平台？
home_faq_platforms_a=Windows、macOS、Linux、Android 和 iOS。每个平台都是同一个应用、同一套文件，而不是把网页装进盒子。
# Under the hood
home_hood_eyebrow=技术实现
home_hood_title=面向技术爱好者
home_hood_native_header=原生，而非网页
home_hood_native_body=基于 Kotlin 和 Compose Multiplatform 构建。一套代码库，五个平台上的真正原生客户端，而不是套了个应用外壳的网页。
home_hood_screens_header=适配你的屏幕
home_hood_screens_body=手机、平板、笔记本或大尺寸桌面显示器：布局会扩展以利用你已有的空间。全程支持浅色与深色主题。
home_hood_license_header=MIT 许可证，可自托管
home_hood_license_body=阅读源码、自行构建、运行你自己的同步服务器。应用内没有任何遥测，也不会为了校验许可证而回传任何数据。
